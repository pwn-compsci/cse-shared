worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format auth_log '$remote_addr - $time_local '
                    '"$request" $status '
                    'auth_location=$auth_location '
                    'upstream_target=$upstream_target '
                    'cookie="$http_cookie"';
    access_log /var/log/nginx/auth.log auth_log;

    map $http_cookie $is_authenticated {
        default 0;
        "~*auth_token=LETMEIN" 1;
    }

    map $is_authenticated $auth_location {
        1 code_authenticated;
        default code_unauthenticated;
    }

    # Updated map to use the correct port 4200
    map $auth_location $upstream_target {
        code_authenticated http://127.0.0.1:4200;
        code_unauthenticated http://127.0.0.1:5000;
        default http://localhost:5000; # Default if $auth_location is unexpected
    }

    server {
        listen 8080;

        # Custom error pages
        error_page 502 503 504 /502.html;
        location = /502.html {
            root /challenge/web;
            internal;
        }

        location /exam_api {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires 0 always;
        }

        location /proxy/5900 {
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;


            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_cache_bypass $http_upgrade;

            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:5900;

            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_send_timeout 300;

            # ✅ Add these headers here
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires 0 always;
            add_header X-Auth-Location $auth_location; # Keep this for logging/debugging
        }
        location /proxy/6080 {
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;


            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_cache_bypass $http_upgrade;

            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:6080;

            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_send_timeout 300;

            # ✅ Add these headers here
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires 0 always;
            add_header X-Auth-Location $auth_location; # Keep this for logging/debugging
        }
        
        location /js {
                alias /challenge/web/js/;
                access_log off;
                add_header Cache-Control "public, max-age=3600";
                
                # Explicitly set MIME type for JavaScript files
                location ~* \.js$ {
                    add_header Content-Type application/javascript;
                    add_header Cache-Control "public, max-age=3600";
                }
        }

        location /hb {
                add_header Content-Type text/plain;
                return 200 "beep";
        }

        location / {
            sub_filter_once off;
            sub_filter '</head>' '<!--CSE240_EXAM-->
<style>
.exam-badge {
  position: fixed;
  top: 0px;
  left: 0px;
  background-color: rgba(63, 81, 181, 0.9);  /* Indigo (blue-purple) */
  color: white;
  font-family: sans-serif;
  font-size: 15px;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  z-index: 9999;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
}

.exam-reload-btn {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 4px;
  color: white;
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  pointer-events: auto;
  transition: all 0.2s ease;
  user-select: none;
}

.exam-reload-btn:hover {
  background: rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 255, 255, 0.5);
  transform: scale(1.05);
}

.exam-reload-btn:active {
  transform: scale(0.95);
}
</style>
<script src="js/exam-badge.js?v={{random_integer1}}"></script></head>';

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Accept-Encoding "";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_cache_bypass $http_upgrade;

            proxy_http_version 1.1;
            proxy_pass $upstream_target;

            proxy_buffering off;
            proxy_read_timeout 300;
            proxy_send_timeout 300;

            # ✅ Add these headers here
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires 0 always;
            add_header X-Auth-Location $auth_location; # Keep this for logging/debugging
        }

    }

}


